<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>とある一人の存在目録</title>
<style>
  :root {
    --bg: #faf8f4;
    --fg: #2b2a28;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --fg: #e8e4dc; }
  }
  html { background: var(--bg); color: var(--fg); }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    box-sizing: border-box;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif;
    line-height: 1.9;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 500; letter-spacing: .04em; }
</style>
</head>
<body>
<main>
  <h1>とある一人の存在目録</h1>
</main>
</body>
</html>
